<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Works - Academia Augustiniana</title>
    <meta name="description" content="Works by an Augustinian author.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="nav.js" defer></script>
</head>
<body>
    <nav class="navbar glass">
        <div class="logo">Academia Augustiniana</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="authors.html" class="active">Authors</a></li>
            <li><a href="library.html">Library</a></li>
            <li><a href="theses.html">Theses</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
    <main class="page-container">
        <h1 id="author-page-title" class="page-title">Works</h1>
        <div id="works-list" class="works-list"></div>
    </main>

    <script src="library-data.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const params     = new URLSearchParams(window.location.search);
            const authorName = params.get("name") || "";

            // Update page title and browser tab
            const titleEl = document.getElementById("author-page-title");
            if (authorName) {
                titleEl.textContent = `Works by ${authorName}`;
                document.title = `Works by ${authorName} - Academia Augustiniana`;
            } else {
                titleEl.textContent = "Author Not Found";
                document.getElementById("works-list").innerHTML =
                    `<p style="text-align:center;color:var(--text-secondary);padding:2rem 0;">No author name was specified in the URL.</p>`;
                return;
            }

            initAuthorWorks(authorName, "works-list");
        });
    </script>
</body>
</html>
